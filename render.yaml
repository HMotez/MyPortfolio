# Render Blueprint — creates the contact API and the website in one step.
# Render dashboard → New → Blueprint → pick this repository. See DEPLOY.md.
#
# Render's free web services block outbound SMTP (ports 25/465/587), so in
# production the API sends mail through Resend's HTTP API (free: 100 emails/day).

services:
  # ── Contact API (Express), Docker ────────────────────────────────────────────
  - type: web
    name: portfolio-api-hmotez        # → https://portfolio-api-hmotez.onrender.com
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:                      # rebuild only when the API's own files change
      paths:
        - server/**
        - docker/Dockerfile.backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: '["https://portfolio-hmotez.onrender.com"]'
      - key: RESEND_API_KEY
        sync: false                     # Resend → API Keys (asked at creation)
      - key: CONTACT_TO
        sync: false                     # inbox that receives messages = your Resend account email

  # ── Website (React + Vite build), static ─────────────────────────────────────
  - type: web
    name: portfolio-hmotez            # → https://portfolio-hmotez.onrender.com
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - server/**
        - docker/**
        - "**/*.md"
        - screenshots/**
    envVars:
      - key: VITE_API_URL
        value: https://portfolio-api-hmotez.onrender.com
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite                   # single-page app: every path serves index.html
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
