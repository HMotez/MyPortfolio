services:

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    # GMAIL_USER / GMAIL_APP_PASSWORD (or RESEND_API_KEY) — see .env.example, never committed
    env_file: .env
    environment:
      PORT: 5000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ""          # same site: nginx proxies /api to the backend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
